      choices: [
        { text: '吃掉它（回复 10 生命，获得 1 层力量）', result: '果肉很苦，胃里却烧起一小团火。', gain: { heal: 10, strength: 1 } },
        { text: '放回去', result: '你把它摆正，神龛里好像有人笑了一声。' },
      ],
    },
    {
      id: 'forge', title: '荒废旧炉', desc: '炉膛里还有温度，铁砧上放着一把没开刃的短刀。',
      choices: [
        { text: '拿走它（获得一张随机攻击牌）', result: '刀比看上去沉，你把它别在腰后。', gain: { randomCard: 'attack' } },
        { text: '往炉里添柴，暖一会（回复 12 生命）', result: '火光映在墙上，你的影子终于不再发抖。', gain: { heal: 12 } },
      ],
    },
  ];

  let UID = 1;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function makeCard(type) {
    const def = CARD_DEFS[type];
    return { uid: UID++, type, name: def.name, cost: def.cost, type2: def.type, text: def.text, ops: def.ops, kw: def.kw };
  }

  function newRun(seed) {
    const rng = mulberry32((seed >>> 0) || 1);
    const run = {
      seed, rng,
      hp: CONFIG.MAX_HP, maxHp: CONFIG.MAX_HP,
      gold: 10, strength: 0,
      deck: [],
      phase: 'title',
      nodes: NODES.map((n) => ({ ...n, done: false })),
      nodeIdx: 0,
      battle: null,
      dialog: null,
      event: null,
      shop: null,
      reward: null,
      resultText: '',
      stats: { turns: 0, dmgDealt: 0, dmgTaken: 0, cardsPlayed: 0, battles: 0 },
      log: '',
    };
    for (let i = 0; i < 5; i++) run.deck.push(makeCard('strike'));
    for (let i = 0; i < 4; i++) run.deck.push(makeCard('defend'));
    run.deck.push(makeCard('bash'));
    return run;
  }

  function enemyOf(idx) {
    return ENEMIES[Math.min(idx, ENEMIES.length - 1)];
  }

  function currentNode(run) {
    return run.nodes[run.nodeIdx] || null;
  }

  // ── 战斗 ───────────────────────────────────────────────────
  function startBattle(run, enemyIdx) {
    const e = enemyOf(enemyIdx);
    run.battle = {
      enemyIdx,
      enemyHp: e.hp, enemyMax: e.hp,
      enemyVuln: 0, enemyBlock: 0, enemyWeak: 0, enemyStr: 0,
      playerWeak: 0, playerSilence: 0,
      intentIdx: 0, turn: 0, block: 0, energy: 0,
      draw: shuffle(run.deck.slice(), run.rng),
      hand: [], discard: [], limbo: null,
      over: false, result: null,
    };
    run.stats.battles++;
    beginTurn(run);
    run.phase = 'battle';
  }

  function battleIntent(b) {
    const e = enemyOf(b.enemyIdx);
    const it = e.intents[b.intentIdx % e.intents.length];
    if (it.k === 'attack') return { k: 'attack', v: it.v + b.enemyStr };
    return { ...it };
  }

  function beginTurn(run) {
    const b = run.battle;
    b.turn++;
    b.block = 0;
    b.energy = CONFIG.ENERGY;
    if (b.enemyVuln > 0) b.enemyVuln--;
    if (b.playerWeak > 0) b.playerWeak--;
    drawCards(run, CONFIG.DRAW);
    run.stats.turns++;
  }

  function drawCards(run, n) {
    const b = run.battle;
    for (let i = 0; i < n; i++) {
      if (!b.draw.length) {
        if (!b.discard.length) return;
        b.draw = shuffle(b.discard.slice(), run.rng);
        b.discard = [];
      }
      const c = b.draw.pop();
      if (b.hand.length < CONFIG.HAND_CAP) b.hand.push(c);
      else b.discard.push(c);
    }
  }

  function attackDamage(run, base) {
    const b = run.battle;
    let dmg = base + run.strength;
    if (b.playerWeak > 0) dmg = Math.floor(dmg * CONFIG.WEAK_MULT);
    return dmg;
  }

  function applyOp(run, op) {
    const b = run.battle;
    if (op.k === 'damage') {
      let dmg = attackDamage(run, op.v);
      if (b.enemyVuln > 0) dmg = Math.floor(dmg * CONFIG.VULN_MULT);
      const absorbed = Math.min(b.enemyBlock, dmg);
      b.enemyBlock -= absorbed;
      dmg -= absorbed;
      b.enemyHp = Math.max(0, b.enemyHp - dmg);
      run.stats.dmgDealt += dmg;
      const parts = [];
      if (b.enemyVuln > 0) parts.push('易伤');
      if (b.playerWeak > 0) parts.push('虚弱');
      const blocked = absorbed > 0 ? `，格挡吃掉 ${absorbed}` : '';
      run.log = `造成 ${dmg} 点伤害${parts.length ? '（' + parts.join('·') + '）' : ''}${blocked}`;
    } else if (op.k === 'block') {
      b.block += op.v;
      run.log = `获得 ${op.v} 点格挡`;
    } else if (op.k === 'vuln') {
      b.enemyVuln += op.v;
      run.log = `敌人获得 ${op.v} 层易伤`;
    } else if (op.k === 'weak') {
      b.enemyWeak += op.v;
      run.log = `敌人获得 ${op.v} 层虚弱`;
    } else if (op.k === 'str') {
      run.strength += op.v;
      run.log = `你获得 ${op.v} 点力量`;
    } else if (op.k === 'heal') {
      run.hp = Math.min(run.maxHp, run.hp + op.v);
      run.log = `回复 ${op.v} 点生命`;
    }
  }

  function canPlay(run, card) {
    const b = run.battle;
    if (!b || b.over) return { ok: false, why: 'over' };
    if (!card) return { ok: false, why: 'gone' };
    if (card.type2 === 'attack' && b.playerSilence > 0) return { ok: false, why: 'silence' };
    if (b.energy < card.cost) return { ok: false, why: 'energy' };
    return { ok: true };
  }

  function playCard(run, uid) {
    const b = run.battle;
    const c = b.hand.find((x) => x.uid === uid);
    const check = canPlay(run, c);
    if (!check.ok) return check;
    b.energy -= c.cost;
    b.hand = b.hand.filter((x) => x.uid !== uid);
    b.limbo = c;
    for (const op of c.ops) applyOp(run, op);
    b.limbo = null;
    b.discard.push(c);
    run.stats.cardsPlayed++;
    if (b.enemyHp <= 0) { b.over = true; b.result = 'win'; }
    return { ok: true };
  }

  function enemyAct(run) {
    const b = run.battle;
    const intent = battleIntent(b);
    b.enemyBlock = 0;
    if (intent.k === 'defend') {
      b.enemyBlock = intent.v;
      run.log = `敌人获得 ${intent.v} 点格挡`;
    } else if (intent.k === 'attack') {
      let dmg = intent.v;
      if (b.enemyWeak > 0) dmg = Math.floor(dmg * CONFIG.WEAK_MULT);
      const absorbed = Math.min(b.block, dmg);
      b.block -= absorbed;
      dmg -= absorbed;
      if (dmg > 0) {
        run.hp -= dmg;
        run.stats.dmgTaken += dmg;
        run.log = `敌人攻击 ${intent.v} 点，你受到 ${dmg} 点${absorbed > 0 ? `（格挡抵消 ${absorbed}）` : ''}`;
      } else {
        run.log = `敌人攻击 ${intent.v} 点，被格挡完全抵消`;
      }
    } else if (intent.k === 'weak') {
      b.playerWeak += intent.v;
      run.log = `你获得 ${intent.v} 层虚弱`;
    } else if (intent.k === 'silence') {
      b.playerSilence = 1;
      run.log = '你被沉默：本回合不能打出攻击牌';
    } else if (intent.k === 'buff') {
      b.enemyStr += intent.v;
      run.log = `敌人气势暴涨（攻击 +${intent.v}）`;
    }
    b.intentIdx++;
    if (b.enemyWeak > 0) b.enemyWeak--;
    if (run.hp <= 0) { run.hp = 0; b.over = true; b.result = 'lose'; }
  }

  function endTurn(run) {
    const b = run.battle;
    if (b.over) return;
    b.playerSilence = 0;
    b.discard.push(...b.hand);
    b.hand = [];
    enemyAct(run);
    if (!b.over) beginTurn(run);
  }

  // ── 节点流转 ───────────────────────────────────────────────
  function advanceNode(run) {
    const cur = currentNode(run);
    if (cur) cur.done = true;
    run.nodeIdx++;
    run.log = '';
    if (run.nodeIdx >= run.nodes.length) {
      run.phase = 'ending';
      run.resultText = 'win';
      return;
    }
    run.phase = 'map';
  }

  function enterNode(run) {
    const node = currentNode(run);
    if (!node) return;
    if (node.type === 'battle') {
      const e = enemyOf(node.enemy);
      run.dialog = { lines: [e.intro], idx: 0, after: () => { startBattle(run, node.enemy); } };
      run.phase = 'dialog';
    } else if (node.type === 'event') {
      const pool = EVENTS.filter((ev) => ev.id !== run.lastEvent);
      const ev = pool[Math.floor(run.rng() * pool.length)];
      run.lastEvent = ev.id;
      run.event = { def: ev, resolved: false, resultText: '' };
      run.phase = 'event';
    } else if (node.type === 'rest') {
      run.phase = 'rest';
    } else if (node.type === 'shop') {
      const pool = shuffle(REWARD_POOL.slice(), run.rng).slice(0, 3);
      run.shop = {
        cards: pool.map((t, i) => ({ type: t, price: 40 + i * 10, bought: false })),
        healBought: false,
      };
      run.phase = 'shop';
    }
  }

  function finishBattle(run) {
    const b = run.battle;
    if (b.result === 'lose') {
      run.phase = 'ending';
      run.resultText = 'lose';
      return;
    }
    const node = currentNode(run);
    const gold = node && node.boss ? CONFIG.GOLD_ELITE : CONFIG.GOLD_WIN;
    run.gold += gold;
    run.battle = null;
    run.reward = {
      gold,
      cards: shuffle(REWARD_POOL.slice(), run.rng).slice(0, 3),
      picked: false,
    };
    run.phase = 'reward';
  }

  function pickReward(run, type) {
    if (run.reward.picked) return;
    run.reward.picked = true;
    if (type) run.deck.push(makeCard(type));
    advanceNode(run);
  }

  function applyEventChoice(run, idx) {
    const ev = run.event;
    if (ev.resolved) return;
    const choice = ev.def.choices[idx];
    if (choice.cost) {
      if (choice.cost.hp && run.hp <= choice.cost.hp) { run.log = '生命不够，做不了。'; return; }
      if (choice.cost.gold && run.gold < choice.cost.gold) { run.log = '金币不够。'; return; }
      if (choice.cost.hp) run.hp -= choice.cost.hp;
      if (choice.cost.gold) run.gold -= choice.cost.gold;
    }
    let text = choice.result || '';
    if (choice.gamble) {
      if (run.rng() < 0.5) { run.gold += 30; text = '骨片翻面：你赢了。骷髅把一袋金币推过来。'; }
      else { run.hp = Math.max(1, run.hp - 8); text = '骨片翻面：你输了。它笑着收走了你的一点血。'; }
    }
    if (choice.gambleLoot) {
      if (run.rng() < 0.6) {
        const t = REWARD_POOL[Math.floor(run.rng() * REWARD_POOL.length)];
        run.deck.push(makeCard(t));
        text = `箱子里是「${CARD_DEFS[t].name}」。`;
      } else {
        run.hp = Math.max(1, run.hp - 9);
        text = '箱底是碎的玻璃碴。你割破了手。';
      }
    }
    if (choice.gain) {
      const g = choice.gain;
      if (g.heal) run.hp = Math.min(run.maxHp, run.hp + g.heal);
      if (g.hp) run.hp = Math.max(1, run.hp + g.hp);
      if (g.gold) run.gold += g.gold;
      if (g.strength) run.strength += g.strength;
      if (g.card) run.deck.push(makeCard(g.card));
      if (g.randomCard) {
        const pool = REWARD_POOL.filter((t) => CARD_DEFS[t].type === 'attack');
        run.deck.push(makeCard(pool[Math.floor(run.rng() * pool.length)]));
      }
      if (g.removeCard) {
        const i = run.deck.findIndex((c) => c.type === g.removeCard);
        if (i >= 0) run.deck.splice(i, 1);
      }
    }
    ev.resolved = true;
    ev.resultText = text;
  }

  function leaveEvent(run) {
    advanceNode(run);
  }

  function buyCard(run, idx) {
    const item = run.shop.cards[idx];
    if (!item || item.bought || run.gold < item.price) return;
    run.gold -= item.price;
    item.bought = true;
    run.deck.push(makeCard(item.type));
    run.log = `买下「${CARD_DEFS[item.type].name}」。`;
  }

  function buyHeal(run) {
    if (run.shop.healBought || run.gold < 30) return;
    run.gold -= 30;
    run.shop.healBought = true;
    run.hp = Math.min(run.maxHp, run.hp + 25);
    run.log = '喝下一碗热汤，伤口不再疼了。';
  }

  function leaveShop(run) {
    advanceNode(run);
  }

  function restHeal(run) {
    run.hp = Math.min(run.maxHp, run.hp + Math.floor(run.maxHp * 0.3));
    advanceNode(run);
  }

  function restRemove(run) {
    const i = run.deck.findIndex((c) => c.type === 'strike');
    if (i >= 0) run.deck.splice(i, 1);
    advanceNode(run);
  }

    // ── 绘制工具 ────────────────────────────────────────────
    text(x, y, str, size = 17, color = COL.text, align = 'center') {
      return this.add.text(x, y, str, { fontFamily: FONT, fontSize: `${size}px`, color, align }).setOrigin(0.5);
    }

    bar(x, y, w, h, ratio, color) {
      const g = this.add.graphics();
      g.fillStyle(0x1c2030, 1);
      g.fillRoundedRect(x, y, w, h, h / 2);
      const rw = Math.max(0, Math.min(1, ratio)) * w;
      if (rw > 0) { g.fillStyle(color, 1); g.fillRoundedRect(x, y, rw, h, h / 2); }
      return g;
    }

    button(x, y, w, h, label, onClick, tone = 0x3b5bdb, disabled = false) {
      const g = this.add.graphics();
      const draw = (c) => { g.clear(); g.fillStyle(c, disabled ? 0.4 : 1); g.fillRoundedRect(-w / 2, -h / 2, w, h, 10); g.lineStyle(2, 0xffffff, 0.16); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 10); };
      draw(tone);
      const t = this.text(0, 0, label, 18, '#ffffff');
      const c = this.add.container(x, y, [g, t]);
      c.setSize(w, h);
      if (disabled) return c;
      c.setInteractive(new Phaser.Geom.Rectangle(-w / 2, -h / 2, w, h), Phaser.Geom.Rectangle.Contains);
      c.on('pointerover', () => draw(Phaser.Display.Color.ValueToColor(tone).brighten(14).color));
      c.on('pointerout', () => draw(tone));
      c.on('pointerdown', onClick);
      return c;
    }

    hideTip() { if (this.tip) { this.tip.destroy(true); this.tip = null; } }

    showTip(cx, cy, lines) {
      this.hideTip();
      const w = 330, pad = 12, lh = 21;
      const h = pad * 2 + lines.length * lh;
      let ty = cy;
      if (ty - h / 2 < 8) ty = h / 2 + 8;
      if (ty + h / 2 > H - 8) ty = H - h / 2 - 8;
      const bg = this.add.graphics();
      bg.fillStyle(0x080a10, 0.98);
      bg.fillRoundedRect(-w / 2, -h / 2, w, h, 10);
      bg.lineStyle(1, 0x39405e, 1);
      bg.strokeRoundedRect(-w / 2, -h / 2, w, h, 10);
      const kids = [bg];
      lines.forEach((ln, i) => {
        kids.push(this.add.text(-w / 2 + pad, -h / 2 + pad + i * lh, ln.text, {
          fontFamily: FONT, fontSize: `${ln.size || 14}px`, color: ln.color || '#e8eaf2',
        }).setOrigin(0, 0));
      });
      this.tip = this.add.container(cx, ty, kids).setDepth(9999);
    }

    badge(x, y, key, stacks, prefix = '') {
      const k = KEYWORDS[key];
      const g = this.add.graphics();
      g.fillStyle(0x12151f, 1);
      g.fillCircle(0, 0, 19);
      g.lineStyle(2, 0xffffff, 0.14);
      g.strokeCircle(0, 0, 19);
      g.lineStyle(2, Phaser.Display.Color.HexStringToColor(k.color).color, 1);
      g.strokeCircle(0, 0, 19);
      const t = this.text(0, 0, k.short + (stacks > 1 ? stacks : ''), 17, k.color);
      const c = this.add.container(x, y, [g, t]);
      c.setSize(38, 38);
      c.setInteractive(new Phaser.Geom.Rectangle(-19, -19, 38, 38), Phaser.Geom.Rectangle.Contains);
      const show = () => this.showTip(x, y - 56, [
        { text: `${prefix}${k.name}${stacks > 1 ? ' ×' + stacks : ''}`, color: k.color, size: 15 },
        { text: k.desc, color: '#c9cde0' },
      ]);
      c.on('pointerover', show);
      c.on('pointerdown', show);
      c.on('pointerout', () => this.hideTip());
      return c;
    }

    cardView(card, x, y, opts = {}) {
      const cw = opts.w || L.hand.cw;
      const ch = opts.h || L.hand.ch;
      const baseY = y;
      const cont = this.add.container(x, y);
      const g = this.add.graphics();
      const fill = card.type2 === 'attack' ? COL.attack : card.type2 === 'power' ? COL.power : COL.skill;

      g.fillRoundedRect(-cw / 2, -ch / 2, cw, ch, 10);

      g.fillRoundedRect(-cw / 2 + 2, -ch / 2 + 2, cw - 4, ch - 4, 9);

      g.strokeRoundedRect(-cw / 2, -ch / 2, cw, ch, 10);

      const iconKey = card.type2 === 'attack' ? 'icon-attack' : card.type2 === 'power' ? 'icon-power' : 'icon-skill';
      const icon = this.add.image(-cw / 2 + 22, -ch / 2 + 24, iconKey).setDisplaySize(26, 26);

      if (opts.onClick) {

          this.tweens.add({ targets: cont, scale: 1.06, y: baseY - 10, duration: 90 });
          const lines = [
            { text: `${card.name}  ·  ${card.cost} 费  ·  ${tag}`, color: '#ffffff', size: 15 },

    // ── 背景 ────────────────────────────────────────────────
    drawDungeon() {
      const g = this.add.graphics();
      g.fillStyle(COL.bg, 1);
      g.fillRect(0, 0, W, H);
      const bw = 96, bh = 46;
      for (let row = 0; row < H / bh + 1; row++) {
        const off = row % 2 ? bw / 2 : 0;
        for (let col = -1; col < W / bw + 1; col++) {
          const x = col * bw + off, y = row * bh;
          g.fillStyle(0x10131c, 1);
          g.fillRect(x + 2, y + 2, bw - 4, bh - 4);
          g.lineStyle(1, 0x191e2b, 1);
          g.strokeRect(x + 2, y + 2, bw - 4, bh - 4);
        }
      }
      g.fillStyle(0x3a2410, 0.22);
      g.fillCircle(40, 320, 210);
      g.fillCircle(W - 40, 320, 210);
      return g;
    }

    // ── 主渲染分派 ──────────────────────────────────────────
    render() {
      this.tweens.killAll();
      this.hideTip();
      this.input.removeAllListeners('pointerdown');
      this.children.removeAll(true);
      this.cardViews = new Map();

      const run = this.run;
      this.drawDungeon();

      if (run.phase === 'title') this.renderTitle(run);
      else if (run.phase === 'dialog') this.renderDialog(run);
      else if (run.phase === 'map') this.renderMap(run);
      else if (run.phase === 'battle') this.renderBattle(run);
      else if (run.phase === 'reward') this.renderReward(run);
      else if (run.phase === 'event') this.renderEvent(run);
      else if (run.phase === 'shop') this.renderShop(run);
      else if (run.phase === 'rest') this.renderRest(run);
      else if (run.phase === 'ending') this.renderEnding(run);

      this.renderFloats();
    }

    // ── 标题 ────────────────────────────────────────────────
    renderTitle(run) {
      this.text(W / 2, 380, '残月守夜人', 54, COL.gold);
      this.text(W / 2, 448, '一个关于钟声没有响起的夜晚', 17, COL.dim);
      this.add.rectangle(W / 2, 640, 520, 2, 0x2a3147);
      this.text(W / 2, 700, '卡牌 · Roguelike · 单机', 15, COL.dim);
      this.button(W / 2, 840, 260, 64, '开始守夜', () => this.beginRun(), 0x2f6a4a);
      this.text(W / 2, 1210, '素材：Pixel Art Atlas（CC0）· 自绘界面 · 无外部依赖', 12, '#4a5066');
    }

    beginRun() {
      const run = this.run;
      run.dialog = { lines: PROLOGUE.slice(), idx: 0, after: () => { run.phase = 'map'; } };
      run.phase = 'dialog';
      this.startBgm();
      this.scheduleRender();
    }

    // ── 对话 ────────────────────────────────────────────────
    renderDialog(run) {
      const d = run.dialog;
      const line = d.lines[d.idx];
      this.add.rectangle(W / 2, 980, W - 60, 260, 0x080a10, 0.92).setStrokeStyle(2, 0x2a3147);
      this.text(W / 2, 900, `—— ${d.idx + 1} / ${d.lines.length} ——`, 13, COL.dim);
      const t = this.add.text(70, 940, line, {
        fontFamily: FONT, fontSize: '22px', color: '#e8eaf2',
        wordWrap: { width: W - 140 }, lineSpacing: 10,
      }).setOrigin(0, 0);
      this.text(W / 2, 1130, '点击继续 ▸', 14, COL.dim);
      this.input.once('pointerdown', () => {
        this.sfx('tap');
        if (d.idx + 1 < d.lines.length) { d.idx++; this.render(); }
        else { const after = d.after; run.dialog = null; after(); this.render(); }
      });
    }

    // ── 地图 ────────────────────────────────────────────────
    renderMap(run) {
      this.text(W / 2, 120, '残月森林', 34, COL.gold);
      this.text(W / 2, 168, `第 ${run.nodeIdx + 1} / ${run.nodes.length} 段路`, 15, COL.dim);

      const startY = 280;
      const gapY = 150;
      run.nodes.forEach((n, i) => {
        const y = startY + i * gapY;
        const isCurrent = i === run.nodeIdx;
        const isDone = n.done;
        const color = isDone ? 0x2a2f3d : isCurrent ? 0x3b5bdb : 0x1a1f2c;
        const g = this.add.graphics();
        g.fillStyle(color, isCurrent ? 1 : 0.85);
        g.fillRoundedRect(60, y - 44, W - 120, 88, 14);
        g.lineStyle(2, isCurrent ? 0x8ab4f8 : 0x232a3a, 1);
        g.strokeRoundedRect(60, y - 44, W - 120, 88, 14);
        this.text(120, y, n.icon, 30, isCurrent ? '#ffffff' : '#5b6075');
        this.text(180, y - 12, n.label, 21, isDone ? '#4a5066' : isCurrent ? '#ffffff' : '#6b7088').setOrigin(0, 0.5);
        const sub = n.type === 'battle' ? (n.boss ? '首领' : '战斗') : n.type === 'event' ? '奇遇' : n.type === 'rest' ? '休整' : '商店';
        this.text(180, y + 18, sub, 13, isDone ? '#3a4055' : '#8b90a6').setOrigin(0, 0.5);

        if (isCurrent) {
          const hit = this.add.zone(W / 2, y, W - 120, 96).setOrigin(0.5).setInteractive();
          hit.on('pointerdown', () => { this.sfx('tap'); enterNode(run); this.scheduleRender(); });
        }
      });

      // 顶部状态
      this.text(30, 60, `生命 ${run.hp}/${run.maxHp}`, 16, '#ff8a80').setOrigin(0, 0.5);
      this.text(W - 30, 60, `金币 ${run.gold}`, 16, COL.gold).setOrigin(1, 0.5);
      if (run.strength) this.text(W / 2, 60, `力量 +${run.strength}`, 15, '#ffd54f');
    }

    // ── 战斗 ────────────────────────────────────────────────
    renderBattle(run) {
      const b = run.battle;
      const e = enemyOf(b.enemyIdx);

      this.text(W / 2, 42, e.name, 22, COL.text);
      this.text(20, 84, `回合 ${b.turn}`, 15, COL.dim).setOrigin(0, 0.5);
      this.text(W - 20, 84, `金币 ${run.gold}`, 13, COL.gold).setOrigin(1, 0.5);

      // 敌人
      const halo = this.add.graphics();
      halo.fillStyle(e.tint, 0.1);
      halo.fillCircle(L.enemy.x, L.enemy.y, L.enemy.r + 20);
      halo.fillStyle(e.tint, 0.16);
      halo.fillCircle(L.enemy.x, L.enemy.y, L.enemy.r + 8);
      const img = this.add.image(L.enemy.x, L.enemy.y, e.icon).setDisplaySize(L.enemy.r * 2.1, L.enemy.r * 2.1);
      this.enemyImg = img;

      this.text(L.enemy.x, L.enemy.y - L.enemy.r - 52, `HP ${b.enemyHp}/${b.enemyMax}`, 19, COL.text);
      this.bar(L.enemy.x - 130, L.enemy.y + L.enemy.r + 26, 260, 18, b.enemyHp / b.enemyMax, COL.red);

      const intent = battleIntent(b);
      const map = {
        attack: `意图：攻击 ${intent.v}`,
        defend: `意图：防御 ${intent.v}`,
        weak: `意图：施加 ${intent.v} 层虚弱`,
        silence: '意图：沉默',
        buff: `意图：强化 +${intent.v}`,
      };
      this.text(L.enemy.x, L.enemy.y + L.enemy.r + 62, map[intent.k] || '', 19, intent.k === 'attack' ? '#ff8a80' : '#ffd54f');

      const eb = [];
      if (b.enemyVuln > 0) eb.push(['vuln', b.enemyVuln]);
      if (b.enemyWeak > 0) eb.push(['weak', b.enemyWeak]);
      if (b.enemyBlock > 0) eb.push(['block', b.enemyBlock]);
      if (b.enemyStr > 0) eb.push(['strength', b.enemyStr]);
      const ebx = L.enemy.x - ((eb.length - 1) * 46) / 2;
      eb.forEach(([k, v], i) => this.badge(ebx + i * 46, L.enemy.y + L.enemy.r + 128, k, v, '敌人：'));

      // 玩家
      const p = L.player;
      const pg = this.add.graphics();
      pg.fillStyle(0x12302a, 0.5);
      pg.fillCircle(p.x, p.y, p.r + 4);
      pg.lineStyle(2, 0x3fbf7f, 0.3);
      pg.strokeCircle(p.x, p.y, p.r + 4);
      this.add.image(p.x, p.y, 'hero').setDisplaySize(p.r * 2.2, p.r * 2.2);

      this.text(p.x, p.y - p.r - 40, `你 · HP ${run.hp}/${run.maxHp}`, 19, COL.text);
      this.bar(p.x - 110, p.y + p.r + 20, 220, 16, run.hp / run.maxHp, COL.green);
      this.text(p.x - 70, p.y + p.r + 52, `能量 ${b.energy}/${CONFIG.ENERGY}`, 17, COL.gold);
      if (b.block > 0) this.text(p.x + 70, p.y + p.r + 52, `格挡 ${b.block}`, 17, '#8ab4f8');

      const pb = [];
      if (b.playerWeak > 0) pb.push(['weak', b.playerWeak]);
      if (b.playerSilence > 0) pb.push(['silence', b.playerSilence]);
      if (run.strength > 0) pb.push(['strength', run.strength]);
      if (b.block > 0) pb.push(['block', b.block]);
      const pbx = p.x - ((pb.length - 1) * 46) / 2;
      pb.forEach(([k, v], i) => this.badge(pbx + i * 46, p.y + p.r + 100, k, v, '你：'));

      // 手牌
      const hand = b.hand;
      const { cw, gap, y: cardY } = L.hand;
      const totalW = hand.length * (cw + gap) - gap;
      const startX = W / 2 - totalW / 2 + cw / 2;
      const turnKey = `${b.turn}`;
      const fresh = turnKey !== this.lastTurnKey;
      this.lastTurnKey = turnKey;
      hand.forEach((c, i) => {
        const x = startX + i * (cw + gap);
        const check = canPlay(run, c);
        const view = this.cardView(c, x, cardY + (fresh ? 60 : 0), {
          disabled: !check.ok,
          onClick: () => this.tryPlay(c.uid),
        });
        if (fresh) this.tweens.add({ targets: view, y: cardY, alpha: 1, duration: 220 + i * 40, ease: 'Cubic.easeOut' });
        this.cardViews.set(c.uid, view);
      });

      if (!b.over) this.button(L.endBtn.x, L.endBtn.y, L.endBtn.w, L.endBtn.h, '结束回合', () => this.doEndTurn());

      if (b.playerSilence > 0) this.text(W / 2, 620, '你被沉默：本回合只能出技能/能力牌', 15, '#ff8a80');
      else if (run.log) this.text(W / 2, 620, run.log, 15, COL.gold);

      this.text(20, 1250, `抽牌堆 ${b.draw.length}`, 14, COL.dim).setOrigin(0, 0.5);
      this.text(140, 1250, `弃牌堆 ${b.discard.length}`, 14, COL.dim).setOrigin(0, 0.5);

      if (b.over) this.drawBattleOver(b);
    }

    drawBattleOver(b) {
      this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.72);
      this.input.once('pointerdown', () => { finishBattle(this.run); this.scheduleRender(); });
      if (b.result === 'lose') {
        this.sfx('lose');
        this.text(W / 2, H / 2 - 60, '你倒下了', 40, '#ff6b6b');
        this.text(W / 2, H / 2 + 10, '点击继续', 16, COL.dim);
      } else {
        this.sfx('win');
        this.text(W / 2, H / 2 - 60, '胜利', 40, COL.gold);
        this.text(W / 2, H / 2 + 10, '点击继续', 16, COL.dim);
      }
    }

    // ── 奖励 ────────────────────────────────────────────────
    renderReward(run) {
      const r = run.reward;
      this.text(W / 2, 200, '战斗胜利', 32, COL.gold);
      this.text(W / 2, 250, `获得 ${r.gold} 金币`, 18, COL.dim);
      this.text(W / 2, 320, '选一张牌加入牌组', 18, COL.dim);
      const cw = 150, gap = 16;
      const totalW = r.cards.length * (cw + gap) - gap;
      const startX = W / 2 - totalW / 2 + cw / 2;
      r.cards.forEach((type, i) => {
        const d = CARD_DEFS[type];
        const card = { uid: -1 - i, type, name: d.name, cost: d.cost, type2: d.type, text: d.text, ops: d.ops, kw: d.kw };
        this.cardView(card, startX + i * (cw + gap), 520, {
          w: 150, h: 200, big: true,
          onClick: () => { pickReward(run, type); this.scheduleRender(); },
        });
      });
      this.button(W / 2, 720, 200, 50, '跳过', () => { pickReward(run, null); this.scheduleRender(); }, 0x2a3550);
    }

    // ── 奇遇 ────────────────────────────────────────────────
    renderEvent(run) {
      const ev = run.event;
      this.text(W / 2, 150, ev.def.title, 30, COL.gold);
      this.add.rectangle(W / 2, 300, W - 100, 180, 0x0a0c12, 0.9).setStrokeStyle(1, 0x2a3147);
      this.add.text(80, 240, ev.def.desc, {
        fontFamily: FONT, fontSize: '18px', color: '#c9cde0',
        wordWrap: { width: W - 160 }, lineSpacing: 8,
      });

      if (!ev.resolved) {
        ev.def.choices.forEach((ch, i) => {
          const y = 520 + i * 96;
          const lack = (ch.cost && ch.cost.hp && run.hp <= ch.cost.hp) || (ch.cost && ch.cost.gold && run.gold < ch.cost.gold);
          this.button(W / 2, y, W - 140, 64, ch.text, () => {
            this.sfx('tap');
            applyEventChoice(run, i);
            this.render();
          }, 0x35406b, !!lack);
        });
      } else {
        this.add.text(80, 460, ev.resultText, {
          fontFamily: FONT, fontSize: '19px', color: '#e8eaf2',
          wordWrap: { width: W - 160 }, lineSpacing: 8,
        });
        this.button(W / 2, 640, 220, 54, '继续', () => { this.sfx('tap'); leaveEvent(run); this.scheduleRender(); }, 0x3b5bdb);
      }

      this.text(30, 60, `生命 ${run.hp}/${run.maxHp}`, 16, '#ff8a80').setOrigin(0, 0.5);
      this.text(W - 30, 60, `金币 ${run.gold}`, 16, COL.gold).setOrigin(1, 0.5);
    }

    // ── 商店 ────────────────────────────────────────────────
    renderShop(run) {
      const shop = run.shop;
      this.text(W / 2, 130, '漂泊商人', 30, COL.gold);
      this.text(W / 2, 172, '「只收金币，不讲价。」', 15, COL.dim);

      shop.cards.forEach((item, i) => {
        const d = CARD_DEFS[item.type];
        const card = { uid: -100 - i, type: item.type, name: d.name, cost: d.cost, type2: d.type, text: d.text, ops: d.ops, kw: d.kw };
        const y = 380 + i * 0;
        const x = 200 + i * 160;
        this.cardView(card, x, 400, {
          w: 140, h: 190,
          onClick: () => {
            if (item.bought) return;
            if (run.gold < item.price) { this.sfx('deny'); return; }
            buyCard(run, i);
            this.sfx('coin');
            this.scheduleRender();
          },
        });
        this.text(x, 530, item.bought ? '已售出' : `${item.price} 金`, 16, item.bought ? '#4a5066' : COL.gold);
      });

      this.button(W / 2, 700, W - 160, 58, shop.healBought ? '热汤（已喝过）' : '热汤 · 25 生命 / 30 金', () => {
        if (shop.healBought || run.gold < 30) { this.sfx('deny'); return; }
        buyHeal(run);
        this.sfx('coin');
        this.scheduleRender();
      }, 0x2f6a4a, shop.healBought || run.gold < 30);

      this.text(30, 60, `生命 ${run.hp}/${run.maxHp}`, 16, '#ff8a80').setOrigin(0, 0.5);
      this.text(W - 30, 60, `金币 ${run.gold}`, 16, COL.gold).setOrigin(1, 0.5);
      if (run.log) this.text(W / 2, 800, run.log, 15, COL.gold);
      this.button(W / 2, 880, 220, 54, '离开', () => { this.sfx('tap'); leaveShop(run); this.scheduleRender(); }, 0x2a3550);
    }

    // ── 篝火 ────────────────────────────────────────────────
    renderRest(run) {
      this.text(W / 2, 260, '篝火', 32, COL.gold);
      this.text(W / 2, 320, '火光照着你，影子终于不抖了。', 17, COL.dim);
      this.button(W / 2, 480, W - 140, 70, '休整 · 回复 30% 生命', () => {
        this.sfx('heal');
        restHeal(run);
        this.scheduleRender();
      }, 0x2f6a4a);
      this.button(W / 2, 590, W - 140, 70, '磨砺 · 移除一张「打击」', () => {
        this.sfx('tap');
        restRemove(run);
        this.scheduleRender();
      }, 0x35406b);
      this.text(30, 60, `生命 ${run.hp}/${run.maxHp}`, 16, '#ff8a80').setOrigin(0, 0.5);
    }

    // ── 结局 ────────────────────────────────────────────────
    renderEnding(run) {
      const win = run.resultText === 'win';
      this.text(W / 2, 200, win ? '钟声' : '长夜', 40, win ? COL.gold : '#ff6b6b');
      const lines = win ? ENDING_WIN : ENDING_LOSE;
      let y = 320;
      lines.forEach((ln) => {
        const t = this.add.text(80, y, ln, {
          fontFamily: FONT, fontSize: '20px', color: win ? '#e8eaf2' : '#c9cde0',
          wordWrap: { width: W - 160 }, lineSpacing: 8,
        });
        y += Math.ceil(t.height) + 28;
      });
      this.text(W / 2, 1000, `出牌 ${run.stats.cardsPlayed} 次 · 战斗 ${run.stats.battles} 场 · 牌组 ${run.deck.length} 张`, 15, COL.dim);
      this.button(W / 2, 1100, 240, 62, '再守一夜', () => {
        this.run = newRun(Date.now() & 0xffff);
        this.scheduleRender();
      }, win ? 0x2f7a4a : 0x8a2b2b);
    }

    // ── 战斗操作 ────────────────────────────────────────────
    scheduleRender() {
      if (this.renderPending) return;
      this.renderPending = true;
      this.time.delayedCall(0, () => {
        this.renderPending = false;
        if (this.scene && this.sys.isActive()) this.render();
      });
    }

    tryPlay(uid) {
      if (this.acting) return;
      this.hideTip();
      const run = this.run;
      const b = run.battle;
      const card = b.hand.find((c) => c.uid === uid);
      if (!card) return;
      const hpBefore = b.enemyHp;
      const blockBefore = b.block;
      const res = playCard(run, uid);
      if (!res.ok) {
        if (res.why === 'energy') run.log = '能量不足';
        else if (res.why === 'silence') run.log = '被沉默：本回合不能出攻击牌';
        this.cameras.main.shake(90, 0.004);
        this.sfx('deny');
        this.scheduleRender();
        return;
      }
      this.acting = true;
      const isAttack = card.type2 === 'attack';
      const view = this.cardViews.get(uid);
      const tx = isAttack ? L.enemy.x : L.player.x;
      const ty = isAttack ? L.enemy.y : L.player.y;
      if (view) this.tweens.add({ targets: view, x: tx, y: ty, scale: 0.25, alpha: 0.2, duration: 240, ease: 'Cubic.easeIn', onComplete: () => { if (view.active) view.destroy(); } });

      if (b.enemyHp < hpBefore) {
        this.addFloat(L.enemy.x + 96, L.enemy.y - 150, `-${hpBefore - b.enemyHp}`, '#ff6b6b');
        this.burst(L.enemy.x, L.enemy.y, 0xffd54f, 14);
        this.sfx('hit');
        this.cameras.main.shake(120, 0.008);
        this.cameras.main.flash(90, 255, 90, 90);
        if (this.enemyImg) this.tweens.add({ targets: this.enemyImg, scaleX: this.enemyImg.scaleX * 1.1, scaleY: this.enemyImg.scaleY * 0.9, duration: 60, yoyo: true });
      } else {
        this.sfx('block');
      }
      if (b.block > blockBefore) {
        this.addFloat(L.player.x - 90, L.player.y + 110, `+${b.block - blockBefore} 格挡`, '#8ab4f8');
        this.burst(L.player.x, L.player.y, 0x8ab4f8, 10);
      }
      if (card.ops.some((o) => o.k === 'vuln')) this.addFloat(L.enemy.x + 96, L.enemy.y - 100, '易伤 +2', '#ffb74d');
      if (card.ops.some((o) => o.k === 'weak')) this.addFloat(L.enemy.x + 96, L.enemy.y - 100, '虚弱 +2', '#b39ddb');
      if (card.ops.some((o) => o.k === 'str')) { this.addFloat(L.player.x, L.player.y + 110, '力量 +2', '#ffd54f'); this.burst(L.player.x, L.player.y, 0xffd54f, 12); }
      if (card.ops.some((o) => o.k === 'heal')) this.addFloat(L.player.x, L.player.y - 100, '+4', '#7ee787');

      this.time.delayedCall(270, () => { this.acting = false; this.scheduleRender(); });
    }

    doEndTurn() {
      if (this.acting) return;
      const run = this.run;
      const b = run.battle;
      const hpBefore = run.hp;
      endTurn(run);
      if (run.hp < hpBefore) {
        this.addFloat(L.player.x, L.player.y + 110, `-${hpBefore - run.hp}`, '#ff6b6b');
        this.burst(L.player.x, L.player.y, 0xff6b6b, 12);
        this.sfx('hurt');
        this.cameras.main.shake(140, 0.009);
        this.cameras.main.flash(110, 200, 40, 40);
      } else {
        this.sfx('block');
      }
      this.acting = true;
      this.time.delayedCall(180, () => { this.acting = false; this.scheduleRender(); });
    }

    burst(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const p = this.add.rectangle(x, y, 5, 5, color);
        const a = Math.random() * Math.PI * 2;
        const d = 36 + Math.random() * 70;
        this.tweens.add({
          targets: p, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d,
          alpha: 0, scale: 0.2, duration: 320 + Math.random() * 180, ease: 'Quad.easeOut',
          onComplete: () => p.destroy(),
        });
      }
    }

    // ── 音频 ────────────────────────────────────────────────
    ensureAudio() {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = this.muted ? 0 : 1;
        this.master.connect(this.ac.destination);
      }
      if (this.ac.state === 'suspended') this.ac.resume();
      return this.ac;
    }

    startBgm() {
      const ctx = this.ensureAudio();
      if (!ctx || this.bgmTimer) return;
      const chords = [
        [220.0, 261.6, 329.6],
        [174.6, 220.0, 261.6],
        [261.6, 329.6, 392.0],
        [196.0, 246.9, 293.7],
      ];
      let i = 0;
      const playChord = () => {
        const c = chords[i % chords.length];
        const t = ctx.currentTime;
        c.forEach((f, j) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = j === 0 ? 'sine' : 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(j === 0 ? 0.05 : 0.03, t + 1.2);
          g.gain.linearRampToValueAtTime(0.0001, t + 5.4);
          o.connect(g);
          g.connect(this.master);
          o.start(t);
          o.stop(t + 5.6);
        });
        i++;
      };
      playChord();
      this.bgmTimer = setInterval(playChord, 5400);
    }

    sfx(kind) {
      const ctx = this.ensureAudio();
      if (!ctx) return;
      const play = (freq, dur, type, vol, when = 0, slideTo = null) => {
        const t0 = ctx.currentTime + when;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g);
        g.connect(this.master);
        o.start(t0);
        o.stop(t0 + dur + 0.03);
      };
      if (kind === 'hit') { play(180, 0.16, 'sawtooth', 0.07, 0, 60); play(90, 0.2, 'square', 0.04, 0.01); }
      else if (kind === 'hurt') play(120, 0.22, 'sawtooth', 0.08, 0, 50);
      else if (kind === 'block') { play(520, 0.1, 'triangle', 0.05); play(780, 0.08, 'sine', 0.03, 0.02); }
      else if (kind === 'deny') play(190, 0.09, 'square', 0.035);
      else if (kind === 'tap') play(600, 0.05, 'sine', 0.03);
      else if (kind === 'coin') { play(880, 0.08, 'triangle', 0.05); play(1180, 0.1, 'sine', 0.04, 0.06); }
      else if (kind === 'heal') { [523, 659].forEach((f, i) => play(f, 0.2, 'sine', 0.05, i * 0.1)); }
      else if (kind === 'win') [523, 659, 784, 1046].forEach((f, i) => play(f, 0.18, 'triangle', 0.06, i * 0.12));
      else if (kind === 'lose') [330, 262, 196, 147].forEach((f, i) => play(f, 0.24, 'sawtooth', 0.05, i * 0.14));
    }

    addFloat(x, y, text, color) {
      this.floats.push({ x, y, text, color, at: this.time.now });
    }

    renderFloats() {
      const now = this.time.now;
      this.floats = this.floats.filter((f) => now - f.at < 900);
      this.floats.forEach((f) => {
        const age = now - f.at;
        const t = this.add.text(f.x, f.y - age * 0.045, f.text, {
          fontFamily: FONT, fontSize: '26px', color: f.color,
          stroke: '#05060a', strokeThickness: 5,
        }).setOrigin(0.5).setDepth(8000);
        this.tweens.add({ targets: t, alpha: 0, duration: Math.max(140, 900 - age), ease: 'Quad.easeIn' });
      });
    }
  }

  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: W,
    height: H,
    backgroundColor: '#0b0d13',
    pixelArt: true,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [GameScene],
  });
  Object.assign(window, { game });
})();
</script>
</body>
</html>
